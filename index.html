<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Final Exam</h1>

    <p id="parag1">This is my practical examination</p>

    <button id="btn1">Alert me</button>
    <button id="btn2">Change Color</button>

     <script>
        document.getElementById("parag1");
        document.querySelector("btn1").addEventListener("click", function(){
            alert("Welcome to IT10");
        })
        document.getElementById("btn2").addEventListener("dblclick",function (){
            document.getElementById("parag1").style.color = "red";
        });
    </script>
</body>
   
</html>
